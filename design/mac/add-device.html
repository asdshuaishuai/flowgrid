<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowGrid — Add Device (macOS)</title>
<style>
  :root { --ink:#171a1f; --muted:#68707d; --green:#10a36f; --blue:#007aff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background: linear-gradient(180deg,#fbfcfd,#eff2f6); font-family:"SF Pro Text","SF Pro Display","PingFang SC","Noto Sans SC",sans-serif; color:var(--ink); display:grid; place-items:center; padding:24px; }
  .dialog { width:400px; border-radius:12px; border:1px solid rgba(83,96,115,0.18); background:#fff; box-shadow:0 18px 38px rgba(15,23,42,0.18); overflow:hidden; }
  .titlebar { display:flex; align-items:center; justify-content:space-between; height:34px; padding:0 10px; border-bottom:1px solid rgba(90,101,117,0.16); background:rgba(255,255,255,0.82); backdrop-filter:blur(16px); font-size:12px; font-weight:700; }
  .traffic { display:flex; align-items:center; gap:7px; }
  .traffic i { width:11px; height:11px; border-radius:50%; display:block; }
  .traffic i:nth-child(1) { background:#ff5f57; }
  .traffic i:nth-child(2) { background:#febc2e; }
  .traffic i:nth-child(3) { background:#28c840; }
  .dialog-body { padding:20px; text-align:center; }
  .steps { display:flex; justify-content:center; gap:8px; margin-bottom:14px; }
  .step { display:grid; width:22px; height:22px; place-items:center; border-radius:999px; background:#e6ebf2; color:#6f7d91; font-size:10px; font-weight:800; transition:all .3s; }
  .step.active { background:var(--blue); color:#fff; }
  .step.done { background:var(--green); color:#fff; }
  h3 { margin:0 0 6px; font-size:16px; font-weight:700; }
  .small { margin:0; color:var(--muted); font-size:11px; line-height:1.4; }
  .scanner { display:grid; width:110px; height:90px; place-items:center; margin:16px auto 12px; border-radius:10px; background:#f4f7fb; }
  .ring { width:40px; height:40px; border:4px solid #d7ebff; border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .progress-bar { height:4px; background:#e2e8f0; border-radius:999px; margin:0 20px 16px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:var(--blue); border-radius:999px; transition:width .3s ease; }
  .device-list { display:grid; gap:8px; margin-top:10px; text-align:left; }
  .mini-device { display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center; border:2px solid transparent; border-radius:10px; padding:10px; cursor:pointer; transition:all .15s; background:#f8fafc; }
  .mini-device:hover { background:#f1f5f9; border-color:#e2e8f0; }
  .mini-device.selected { background:#eff6ff; border-color:var(--blue); }
  .device-icon { display:grid; width:36px; height:36px; place-items:center; border-radius:8px; background:#e6f2ff; color:var(--blue); font-size:12px; font-weight:800; }
  .device-name { margin:0; font-size:13px; font-weight:700; }
  .device-meta { margin:3px 0 0; color:var(--muted); font-size:11px; }
  .badge { border-radius:999px; padding:3px 8px; background:#e8f7ff; color:#0675b9; font-size:10px; font-weight:800; }
  .toolbar { display:flex; justify-content:center; gap:8px; margin-top:16px; }
  .button { display:inline-flex; height:32px; align-items:center; justify-content:center; border:0; border-radius:6px; padding:0 16px; background:var(--blue); color:#fff; font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; text-decoration:none; }
  .button:hover { filter:brightness(1.1); }
  .button:active { filter:brightness(.9); transform:translateY(1px); }
  .button.secondary { border:1px solid rgba(89,101,118,0.2); background:#fff; color:#334155; }
  .button:disabled { opacity:.5; cursor:not-allowed; }
  .success { display:none; padding:24px; text-align:center; }
  .success-icon { width:56px; height:56px; margin:0 auto 12px; border-radius:50%; background:#e8fbf1; color:var(--green); display:grid; place-items:center; font-size:26px; animation:scaleIn .4s ease; }
  @keyframes scaleIn { from { transform:scale(0); } to { transform:scale(1); } }
  .success h3 { margin-bottom:4px; }
  .detail-row { display:flex; justify-content:space-between; padding:6px 0; font-size:12px; border-bottom:1px solid #f1f5f9; }
  .detail-label { color:var(--muted); }
  .detail-value { font-weight:700; }
  .nav-bar { display:flex; gap:6px; padding:10px 14px; border-top:1px solid #e2e8f0; background:#fafafa; }
  .nav-btn { display:inline-flex; height:28px; align-items:center; justify-content:center; border:1px solid #e2e8f0; border-radius:6px; padding:0 11px; background:#fff; color:#475569; font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; text-decoration:none; }
  .nav-btn:hover { border-color:#94a3b8; color:var(--ink); }
</style>
</head>
<body>
<div class="dialog" id="dialog">
  <div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><span>Add Device</span><span></span></div>

  <div class="dialog-body" id="step1">
    <div class="steps">
      <span class="step active" id="s1">1</span>
      <span class="step" id="s2">2</span>
      <span class="step" id="s3">3</span>
    </div>
    <h3>Discover nearby devices</h3>
    <p class="small">Searching via BLE and Wi-Fi Direct…</p>
    <div class="scanner" id="scanner"><span class="ring"></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="device-list" id="deviceList" style="display:none;"></div>
    <div class="toolbar">
      <a class="button secondary" href="main.html">Cancel</a>
      <button class="button" id="connectBtn" disabled onclick="connect()">Connect</button>
    </div>
  </div>

  <div class="success" id="success">
    <div class="success-icon">✓</div>
    <h3>Device Connected</h3>
    <p class="small">Your device is ready to use</p>
    <div style="text-align:left; margin:16px 20px 0;">
      <div class="detail-row"><span class="detail-label">Device</span><span class="detail-value" id="succName">Windows PC</span></div>
      <div class="detail-row"><span class="detail-label">Protocol</span><span class="detail-value">NearLink</span></div>
      <div class="detail-row"><span class="detail-label">Latency</span><span class="detail-value" id="succLat">2.1ms</span></div>
      <div class="detail-row"><span class="detail-label">Encryption</span><span class="detail-value">DTLS 1.3</span></div>
    </div>
    <div class="toolbar" style="margin-top:20px;">
      <a class="button" href="main.html">Done</a>
    </div>
  </div>

  <div class="nav-bar">
    <a class="nav-btn" href="main.html">← Back</a>
    <a class="nav-btn" href="tray.html">Menu Bar</a>
    <a class="nav-btn" href="latency.html">Latency</a>
  </div>
</div>

<script>
const discovered = [
  { icon:'PC', name:'Windows PC', meta:'LAN + NearLink available', sig:'-48dBm', latency:2.1 },
  { icon:'LX', name:'Linux Desktop', meta:'Wi-Fi Direct · -55dBm', sig:'-55dBm', latency:2.8 },
  { icon:'MB', name:'MacBook Air', meta:'AWDL + NearLink', sig:'-42dBm', latency:1.8 }
];
let selected = null;

function startScan() {
  const progress = document.getElementById('progress');
  let p = 0;
  const interval = setInterval(() => {
    p += Math.random() * 15;
    if (p >= 100) { p = 100; clearInterval(interval); onScanDone(); }
    progress.style.width = p + '%';
  }, 300);
}

function onScanDone() {
  document.getElementById('scanner').style.display = 'none';
  const list = document.getElementById('deviceList');
  list.style.display = 'grid';
  list.innerHTML = discovered.map((d,i) => `
    <div class="mini-device" onclick="selectDevice(this,${i})">
      <div class="device-icon">${d.icon}</div>
      <div><p class="device-name">${d.name}</p><p class="device-meta">${d.meta}</p></div>
      <span class="badge">${d.sig}</span>
    </div>
  `).join('');
}

function selectDevice(el, idx) {
  document.querySelectorAll('.mini-device').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  selected = discovered[idx];
  document.getElementById('connectBtn').disabled = false;
}

function connect() {
  document.getElementById('s1').classList.add('done');
  document.getElementById('s2').classList.add('active');
  const btn = document.getElementById('connectBtn');
  btn.disabled = true; btn.textContent = 'Pairing…';
  setTimeout(() => {
    document.getElementById('s2').classList.add('done');
    document.getElementById('s3').classList.add('active');
    setTimeout(() => {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      document.getElementById('succName').textContent = selected.name;
      document.getElementById('succLat').textContent = selected.latency + 'ms';
    }, 700);
  }, 1400);
}

startScan();
</script>
</body>
</html>
