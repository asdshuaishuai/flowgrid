<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowGrid — Connections (KDE)</title>
<style>
  :root { --ink:#171a1f; --muted:#68707d; --line:#d9dee7; --green:#10a36f; --blue:#0878d8; --kde:#3daee9; --red:#dc2626; --amber:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background: linear-gradient(180deg,#fbfcfd,#eff2f6); font-family:"Noto Sans","Noto Sans SC","Segoe UI",sans-serif; color:var(--ink); display:grid; place-items:center; padding:24px; }
  .app { width:520px; border-radius:6px; border:1px solid rgba(72,85,105,0.16); background:#fff; box-shadow:0 18px 42px rgba(24,30,44,0.14); overflow:hidden; display:flex; flex-direction:column; max-height:calc(100vh - 48px); }
  .titlebar { display:flex; align-items:center; justify-content:space-between; height:30px; padding:0 10px; border-bottom:1px solid rgba(90,101,117,0.16); background:#31363b; color:#eef1f4; font-size:12px; font-weight:700; flex-shrink:0; }
  .title-left, .controls { display:flex; align-items:center; gap:7px; }
  .app-icon { width:16px; height:16px; border-radius:4px; background:var(--kde); }
  .controls i { display:block; width:20px; height:16px; border-radius:2px; background:rgba(255,255,255,0.08); cursor:pointer; transition:background .15s; }
  .controls i:hover { background:rgba(255,255,255,0.15); }
  .content { padding:14px; overflow-y:auto; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .status { display:inline-flex; align-items:center; gap:8px; color:#2f3a4d; font-size:12px; font-weight:650; }
  .status-dot { width:7px; height:7px; border-radius:999px; background:var(--green); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .button { display:inline-flex; height:28px; align-items:center; justify-content:center; border:0; border-radius:3px; padding:0 11px; background:var(--kde); color:#fff; font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; text-decoration:none; }
  .button:hover { filter:brightness(1.08); }
  .button:active { filter:brightness(.92); transform:translateY(1px); }
  .button.secondary { border:1px solid rgba(89,101,118,0.2); background:#fff; color:#334155; }
  .device { display:grid; grid-template-columns:42px 1fr auto; gap:10px; align-items:center; border:1px solid rgba(109,122,140,0.18); border-radius:7px; padding:11px; background:rgba(255,255,255,0.88); transition:all .15s; }
  .device:hover { box-shadow:0 2px 10px rgba(15,23,42,0.08); }
  .device.disconnected { opacity:.55; }
  .device-icon { display:grid; width:42px; height:42px; place-items:center; border-radius:8px; background:#e6f2ff; color:var(--kde); font-size:12px; font-weight:800; }
  .device-name { margin:0; font-size:13px; font-weight:800; }
  .device-meta { margin:3px 0 0; color:var(--muted); font-size:11px; }
  .latency { min-width:56px; border-radius:999px; padding:5px 8px; font-size:12px; font-weight:800; text-align:center; transition:all .3s; }
  .latency.good { background:#e8fbf1; color:#07966c; }
  .latency.warn { background:#fef3c7; color:var(--amber); }
  .latency.bad { background:#fee2e2; color:var(--red); }
  .device-actions { display:flex; gap:6px; }
  .icon-btn { width:26px; height:26px; border-radius:3px; border:0; background:transparent; cursor:pointer; display:grid; place-items:center; font-size:13px; color:var(--muted); transition:all .15s; }
  .icon-btn:hover { background:#f1f5f9; color:var(--ink); }
  .section { margin-top:12px; border:1px solid rgba(109,122,140,0.18); border-radius:7px; background:rgba(255,255,255,0.74); overflow:hidden; }
  .section-head { display:flex; justify-content:space-between; align-items:center; padding:9px 10px; border-bottom:1px solid rgba(109,122,140,0.16); font-size:12px; font-weight:800; cursor:pointer; user-select:none; }
  .section-head:hover { background:rgba(241,245,249,0.5); }
  .chevron { transition:transform .2s; display:inline-block; }
  .chevron.collapsed { transform:rotate(-90deg); }
  .section-body { transition:all .2s ease; }
  .section-body.collapsed { display:none; }
  .badge { border-radius:999px; padding:3px 7px; font-size:10px; font-weight:800; }
  .badge.blue { background:#e8f7ff; color:#0675b9; }
  .badge.green { background:#e8fbf1; color:#07966c; }
  .badge.amber { background:#fef3c7; color:#d97706; }
  .badge.red { background:#fee2e2; color:#dc2626; }
  .mapping { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px; }
  .keypair { display:grid; gap:5px; padding:6px; border-radius:5px; transition:background .15s; }
  .keypair:hover { background:rgba(241,245,249,0.6); }
  .keys { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:800; }
  .key { min-width:34px; border:1px solid rgba(80,94,112,0.22); border-radius:4px; padding:5px 7px; background:#fff; text-align:center; }
  .arrow { color:var(--muted); }
  .health-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; }
  .health-card { padding:10px; border-radius:6px; background:#f8fafc; text-align:center; }
  .health-val { font-size:16px; font-weight:800; }
  .health-label { font-size:10px; color:var(--muted); margin-top:3px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:#1e293b; color:#fff; padding:8px 16px; border-radius:8px; font-size:12px; font-weight:600; opacity:0; transition:all .3s ease; pointer-events:none; z-index:100; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .nav-bar { display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--line); background:#fafafa; flex-shrink:0; }
  .nav-btn { display:inline-flex; height:28px; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:3px; padding:0 11px; background:#fff; color:#475569; font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; text-decoration:none; }
  .nav-btn:hover { border-color:#94a3b8; color:var(--ink); }
  .empty-state { text-align:center; padding:30px 20px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="title-left"><span class="app-icon"></span>FlowGrid</div>
    <span>Connections</span>
    <div class="controls"><i title="Minimize">_</i><i title="Maximize">□</i><i title="Close">×</i></div>
  </div>
  <div class="content">
    <div class="toolbar">
      <span class="status"><span class="status-dot" id="connDot"></span><span id="connText">MacBook Pro</span></span>
      <a class="button" href="settings.html">Settings</a>
    </div>
    <div id="deviceList"></div>

    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span>Active Key Mapping <span class="badge blue" id="kmCount">3 rules</span></span>
        <span class="chevron" id="kmChev">▼</span>
      </div>
      <div class="section-body" id="kmBody">
        <div class="mapping">
          <div class="keypair"><div class="keys"><span class="key">Ctrl</span><span class="arrow">→</span><span class="key">⌘</span></div><p style="margin:3px 0 0;color:var(--muted);font-size:11px;">Global</p></div>
          <div class="keypair"><div class="keys"><span class="key">Meta</span><span class="arrow">→</span><span class="key">⌥</span></div><p style="margin:3px 0 0;color:var(--muted);font-size:11px;">KWin safe</p></div>
          <div class="keypair"><div class="keys"><span class="key">Alt</span><span class="arrow">→</span><span class="key">Ctrl</span></div><p style="margin:3px 0 0;color:var(--muted);font-size:11px;">Terminal</p></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span>Protocol Health <span class="badge green" id="healthBadge">Stable</span></span>
        <span class="chevron" id="healthChev">▼</span>
      </div>
      <div class="section-body" id="healthBody">
        <div class="health-grid">
          <div class="health-card"><div class="health-val" id="hLatency">2.8ms</div><div class="health-label">Latency</div></div>
          <div class="health-card"><div class="health-val" id="hLoss">0.01%</div><div class="health-label">Packet Loss</div></div>
          <div class="health-card"><div class="health-val" id="hChannel">149</div><div class="health-label">Wi-Fi Channel</div></div>
          <div class="health-card"><div class="health-val" id="hUptime">99.9%</div><div class="health-label">Uptime</div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="nav-bar">
    <a class="nav-btn" href="keymap.html">Keymap Editor</a>
    <a class="nav-btn" href="tray.html">System Tray</a>
    <a class="nav-btn" href="../mac/main.html" style="margin-left:auto;">Switch to macOS →</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const devices = [
  { id:1, icon:'MB', name:'MacBook Pro', meta:'macOS 15.2 · NearLink · DTLS 1.3', latency:2.8, connected:true },
  { id:2, icon:'PC', name:'Windows Desktop', meta:'Windows 11 · DirectLink · AES-256', latency:0.5, connected:false },
  { id:3, icon:'LX', name:'Linux Server', meta:'KDE Plasma · NearLink · DTLS 1.3', latency:3.2, connected:false }
];

function renderDevices() {
  const el = document.getElementById('deviceList');
  const connected = devices.filter(d=>d.connected);
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  if (connected.length===0) {
    dot.style.background='#94a3b8'; dot.style.animation='none';
    txt.textContent='No devices connected';
    el.innerHTML='<div class="empty-state">No connected devices. Open Settings to discover nearby peers.</div>';
    return;
  }
  dot.style.background='var(--green)'; dot.style.animation='pulse 2s infinite';
  txt.textContent=connected[0].name;
  el.innerHTML = devices.map(d => {
    const latClass = d.latency < 2 ? 'good' : d.latency < 4 ? 'warn' : 'bad';
    return `
    <div class="device ${d.connected?'':'disconnected'}" style="margin-bottom:8px;">
      <div class="device-icon">${d.icon}</div>
      <div><p class="device-name">${d.name}</p><p class="device-meta">${d.meta}</p></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="latency ${latClass}" id="lat-${d.id}">${d.latency.toFixed(1)}ms</div>
        <div class="device-actions">
          ${d.connected ? `<button class="icon-btn" title="Disconnect" onclick="toggleConn(${d.id})">⏻</button>` : `<button class="icon-btn" title="Connect" onclick="toggleConn(${d.id})">↻</button>`}
          <button class="icon-btn" title="Remove" onclick="removeDev(${d.id})">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleConn(id) {
  const d = devices.find(x=>x.id===id);
  if (!d) return;
  d.connected = !d.connected;
  showToast(d.connected ? `Connected to ${d.name}` : `Disconnected ${d.name}`);
  renderDevices();
}

function removeDev(id) {
  const idx = devices.findIndex(x=>x.id===id);
  if (idx>-1) { showToast(`Removed ${devices[idx].name}`); devices.splice(idx,1); renderDevices(); }
}

function toggleSection(head) {
  head.nextElementSibling.classList.toggle('collapsed');
  head.querySelector('.chevron').classList.toggle('collapsed');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

setInterval(() => {
  devices.forEach(d => {
    if (!d.connected) return;
    d.latency = Math.max(0.3, d.latency + (Math.random()-0.5)*0.8);
    const badge = document.getElementById(`lat-${d.id}`);
    if (badge) { badge.textContent = d.latency.toFixed(1)+'ms'; badge.className = 'latency ' + (d.latency < 2 ? 'good' : d.latency < 4 ? 'warn' : 'bad'); }
  });
  const avg = devices.filter(d=>d.connected).reduce((a,d)=>a+d.latency,0) / Math.max(1, devices.filter(d=>d.connected).length);
  document.getElementById('hLatency').textContent = avg.toFixed(1)+'ms';

  const loss = (Math.random() * 0.08).toFixed(2);
  document.getElementById('hLoss').textContent = loss+'%';
  const h = document.getElementById('healthBadge');
  if (parseFloat(loss) < 0.02) { h.textContent='Stable'; h.className='badge green'; }
  else if (parseFloat(loss) < 0.05) { h.textContent='Good'; h.className='badge blue'; }
  else if (parseFloat(loss) < 0.07) { h.textContent='Fair'; h.className='badge amber'; }
  else { h.textContent='Poor'; h.className='badge red'; }
}, 1800);

renderDevices();
</script>
</body>
</html>
