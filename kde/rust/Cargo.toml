[workspace]
members = ["core", "cxx-qt-bridge", "app"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["FlowGrid Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# cxx-qt
cxx-qt = "0.9"
cxx-qt-lib = "0.9"
cxx-qt-build = "0.9"
cxx = "1"

# Other
dirs = "6"
notify = "8"

[profile.release]
opt-level = 3
lto = true
