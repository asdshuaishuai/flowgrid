[package]
name = "flowgrid-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
notify = { workspace = true }

# FFI
libc = "0.2"
foreign-types = "0.3"

# HID (Linux uinput)
input-event-codes = "6"

# D-Bus
zbus = "5"

# BLE (BlueZ)
bluer = { version = "0.17", features = ["full"] }

# DTLS / crypto (system OpenSSL 3.x supports DTLS 1.3)
openssl = "0.10"
openssl-sys = "0.9.117"

# Hex encoding/decoding
hex = "0.4"
serde_json = "1.0"

# Networking
socket2 = "0.5"

# UUID parsing
uuid = "1.0"

# Stream utilities
tokio-stream = "0.1"
x11-clipboard = "0.9"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
